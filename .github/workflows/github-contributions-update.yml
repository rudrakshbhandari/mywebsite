name: GitHub Contributions Update

on:
  schedule:
    # Daily at 08:20 UTC (01:20 PT) — after the prior day's contributions settle.
    - cron: '20 8 * * *'
  workflow_dispatch:

concurrency:
  group: github-contributions-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Same PAT pattern as stats/oura workflows so opened PRs run required checks.
      GH_AUTH_TOKEN: ${{ secrets.OURA_SECRET_UPDATE_TOKEN != '' && secrets.OURA_SECRET_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.OURA_SECRET_UPDATE_TOKEN != '' && secrets.OURA_SECRET_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch GitHub contributions
        id: fetch_contributions
        run: |
          set -o pipefail
          YEAR=$(date -u +%Y) node scripts/fetch_github_contributions.mjs 2>&1 | tee .github_contributions_fetch.log

      - name: Check if contributions changed
        id: check_changes
        if: steps.fetch_contributions.outcome == 'success'
        run: |
          if [ -f .github_contributions_no_change ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            rm -f .github_contributions_no_change
          elif git diff --quiet github_contributions.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create branch and PR if changed
        if: steps.check_changes.outputs.changed == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ env.GH_AUTH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="github-contributions-$(date -u +%Y%m%d-%H%M%S)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          git checkout -b "$BRANCH_NAME"
          git add github_contributions.json
          git commit -m "chore(github): refresh contribution graph [$(date -u +%Y-%m-%d)]"
          git push origin "$BRANCH_NAME"

          PR_URL=$(gh pr create \
            --title "chore(github): refresh contribution graph [$(date -u +%Y-%m-%d)]" \
            --body "Automated refresh of github_contributions.json for the portfolio contribution graph." \
            --base main \
            --head "$BRANCH_NAME")

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "Created PR: $PR_URL"

      - name: Merge contributions PR after CI (poll)
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ env.GH_AUTH_TOKEN }}
        run: |
          PR_URL="${{ steps.create_pr.outputs.pr_url }}"
          echo "Waiting for required checks, then merging: $PR_URL"
          sleep 15

          for attempt in $(seq 1 48); do
            echo "merge attempt $attempt/48..."
            if gh pr merge "$PR_URL" --squash --delete-branch; then
              echo "Merged successfully."
              exit 0
            fi
            STATE=$(gh pr view "$PR_URL" --json state -q .state 2>/dev/null || echo "")
            if [ "$STATE" = "MERGED" ]; then
              echo "PR already merged."
              exit 0
            fi
            MERGE_STATE=$(gh pr view "$PR_URL" --json mergeStateStatus -q .mergeStateStatus 2>/dev/null || echo "")
            if [ "$MERGE_STATE" = "BEHIND" ]; then
              echo "Branch is behind main — updating branch..."
              gh pr update-branch "$PR_URL" || true
            fi
            sleep 15
          done

          echo "::error::Timed out waiting to merge contributions PR."
          exit 1
