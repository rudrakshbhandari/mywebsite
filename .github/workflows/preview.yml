name: Deploy Preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assemble static site
        run: |
          mkdir -p _site
          rsync -av \
            --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'scripts' \
            --exclude 'docs' \
            --exclude 'AGENTS.md' \
            --exclude 'README.md' \
            --exclude 'CHANGELOG.md' \
            --exclude '.env.example' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'workers' \
            ./ _site/

      - name: Build notes data
        run: npm run notes:build -- _site

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=rudrakshbhandari-portfolio --branch=${{ github.head_ref }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const deployUrl = '${{ steps.deploy.outputs.deployment-url }}';
            if (!deployUrl) {
              console.log('No deployment URL found, skipping comment');
              return;
            }

            const body = [
              `### 🔗 Deploy Preview`,
              ``,
              `${deployUrl}`,
              ``,
              `<sub>Built from ${context.sha.substring(0, 7)} on branch \`${context.payload.pull_request.head.ref}\`</sub>`,
            ].join('\n');

            // Find existing preview comment to update instead of spamming
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Deploy Preview')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
