name: Deploy Oura data Worker

on:
  push:
    branches:
      - main
    paths:
      - 'workers/oura-data/**'
      - '.github/workflows/oura-data-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy workers/oura-data/src/index.js --config workers/oura-data/wrangler.toml
