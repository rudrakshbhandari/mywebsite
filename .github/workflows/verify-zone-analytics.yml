name: Verify Zone Analytics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch Cloudflare visitor totals
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_EXTRA_ZONES: ${{ secrets.CF_EXTRA_ZONES }}
          CF_EXTRA_SITE_TAGS: ${{ secrets.CF_EXTRA_SITE_TAGS }}
        run: node scripts/fetch_stats.mjs
      - name: Print website visitor totals
        run: node -e "const s=require('./stats_public.json'); console.log(JSON.stringify(s.websiteVisitors, null, 2));"
