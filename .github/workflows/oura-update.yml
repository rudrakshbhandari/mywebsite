name: Oura Health Data Update

on:
  schedule:
    # 7× daily at PT times (converted to UTC)
    - cron: '30 14,17,20,23,2,5,10 * * *'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: oura-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Oura data
        env:
          OURA_CLIENT_ID: ${{ secrets.OURA_CLIENT_ID }}
          OURA_CLIENT_SECRET: ${{ secrets.OURA_CLIENT_SECRET }}
          # Read refresh token from file, fallback to secret for initial setup
          OURA_REFRESH_TOKEN: ${{ secrets.OURA_REFRESH_TOKEN }}
        run: node scripts/fetch_oura_and_write_json.mjs

      - name: Check if files changed
        id: check_changes
        run: |
          if [ -f .oura_no_change ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            rm -f .oura_no_change
          elif git diff --quiet oura_public.json .oura_token 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oura_public.json .oura_token 2>/dev/null || git add oura_public.json
          git commit -m "feat(health): update Oura Ring metrics [$(date -u +%Y-%m-%d)]"
          git push
