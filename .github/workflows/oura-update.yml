name: Oura Health Data Update

on:
  schedule:
    # 7× daily at PT times (converted to UTC)
    # 7:30am PT  = 14:30 UTC (summer) / 15:30 UTC (winter)
    # 10:30am PT = 17:30 UTC (summer) / 18:30 UTC (winter)
    # 1:30pm PT  = 20:30 UTC (summer) / 21:30 UTC (winter)
    # 4:30pm PT  = 23:30 UTC (summer) / 00:30 UTC next day (winter)
    # 7:30pm PT  = 02:30 UTC next day (summer) / 03:30 UTC (winter)
    # 10:30pm PT = 05:30 UTC (summer) / 06:30 UTC (winter)
    # 3:30am PT  = 10:30 UTC (summer) / 11:30 UTC (winter)
    # Using UTC times that cover both DST and non-DST reasonably
    - cron: '30 14,17,20,23,2,5,10 * * *'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: oura-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Oura data
        env:
          OURA_CLIENT_ID: ${{ secrets.OURA_CLIENT_ID }}
          OURA_CLIENT_SECRET: ${{ secrets.OURA_CLIENT_SECRET }}
          OURA_REFRESH_TOKEN: ${{ secrets.OURA_REFRESH_TOKEN }}
        run: node scripts/fetch_oura_and_write_json.mjs

      - name: Check if data changed
        id: check_changes
        run: |
          if [ -f .oura_no_change ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            rm -f .oura_no_change
          elif git diff --quiet oura_public.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oura_public.json
          git commit -m "feat(health): update Oura Ring metrics [$(date -u +%Y-%m-%d)]"
          git push
