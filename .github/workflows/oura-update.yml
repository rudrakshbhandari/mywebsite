name: Oura Health Data Update

on:
  schedule:
    # Every 15 minutes (reduces deploy churn; was */5 causing 100/day Vercel limit hits)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: oura-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Oura data
        id: fetch_oura
        env:
          # Optional: Personal Access Token path (most reliable for personal projects)
          OURA_ACCESS_TOKEN: ${{ secrets.OURA_ACCESS_TOKEN }}
          OURA_CLIENT_ID: ${{ secrets.OURA_CLIENT_ID }}
          OURA_CLIENT_SECRET: ${{ secrets.OURA_CLIENT_SECRET }}
          OURA_REFRESH_TOKEN: ${{ secrets.OURA_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          node scripts/fetch_oura_and_write_json.mjs 2>&1 | tee .oura_fetch.log

      - name: Check if files changed
        id: check_changes
        if: steps.fetch_oura.outcome == 'success'
        run: |
          if [ -f .oura_no_change ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            rm -f .oura_no_change
          elif git diff --quiet oura_public.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oura_public.json
          git commit -m "feat(health): update Oura Ring metrics [$(date -u +%Y-%m-%d)]"
          git push

      - name: Rotate refresh token secret (OAuth path)
        if: always() && steps.fetch_oura.outcome == 'success'
        env:
          OURA_ACCESS_TOKEN: ${{ secrets.OURA_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.OURA_SECRET_UPDATE_TOKEN }}
        run: |
          if [ -n "$OURA_ACCESS_TOKEN" ]; then
            echo "Using OURA_ACCESS_TOKEN path; refresh token rotation skipped."
            exit 0
          fi

          if [ ! -f .oura_rotated_token ]; then
            echo "No refresh token rotation detected."
            exit 0
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Refresh token rotated but OURA_SECRET_UPDATE_TOKEN is missing."
            echo "::error::Set OURA_SECRET_UPDATE_TOKEN so workflow can auto-update OURA_REFRESH_TOKEN."
            exit 1
          fi

          NEW_REFRESH_TOKEN="$(tr -d '\n' < .oura_rotated_token)"

          for attempt in 1 2 3; do
            if gh secret set OURA_REFRESH_TOKEN --body "$NEW_REFRESH_TOKEN"; then
              rm -f .oura_rotated_token
              echo "Updated OURA_REFRESH_TOKEN secret automatically."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          echo "::error::Failed to update OURA_REFRESH_TOKEN after 3 attempts."
          exit 1

      - name: Open or update dashboard alert issue
        if: steps.fetch_oura.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: Health dashboard automation alert
        run: |
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          LAST_ERROR="$(tail -n 20 .oura_fetch.log | sed 's/\r$//' | tail -n 1)"
          cat > .health_alert_body.md <<EOF
          @rudrakshbhandari the scheduled Oura health dashboard update failed.

          - Workflow: \`Oura Health Data Update\`
          - Run: ${RUN_URL}
          - Branch: \`${GITHUB_REF_NAME}\`
          - Triggered at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          - Last log line: \`${LAST_ERROR}\`

          This usually means the Oura token refresh path or related secrets need attention before the public dashboard goes stale.
          EOF

          ISSUE_NUMBER="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "'"${ISSUE_TITLE}"'") | .number' | head -n 1)"

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --body-file .health_alert_body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file .health_alert_body.md
          fi

      - name: Close dashboard alert issue after recovery
        if: steps.fetch_oura.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: Health dashboard automation alert
        run: |
          ISSUE_NUMBER="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "'"${ISSUE_TITLE}"'") | .number' | head -n 1)"

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue close "$ISSUE_NUMBER" --comment "Automation recovered in https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi
