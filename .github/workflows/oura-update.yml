name: Oura Health Data Update

on:
  schedule:
    # Every 15 minutes (reduces deploy churn; was */5 causing 100/day Vercel limit hits)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: oura-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

# PAT used for git push + gh pr create must NOT be the default GITHUB_TOKEN:
# GitHub suppresses pull_request / push workflows for events created with GITHUB_TOKEN,
# so required status checks never run and PRs cannot merge under branch protection.

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # Prefer OURA_SECRET_UPDATE_TOKEN (same PAT as gh secret set) so PRs are opened as a
      # real user and CI (checks / preview) runs. Falls back to GITHUB_TOKEN for fetch-only.
      GH_AUTH_TOKEN: ${{ secrets.OURA_SECRET_UPDATE_TOKEN != '' && secrets.OURA_SECRET_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.OURA_SECRET_UPDATE_TOKEN != '' && secrets.OURA_SECRET_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}

      # GitHub forbids `secrets` in step `if:` — that made the whole workflow invalid and
      # stopped schedule + workflow_dispatch. Use env + bash instead.
      - name: Warn if Oura PAT missing for PR merges
        env:
          OURA_PAT_CONFIGURED: ${{ secrets.OURA_SECRET_UPDATE_TOKEN != '' && 'yes' || 'no' }}
        run: |
          if [ "${OURA_PAT_CONFIGURED}" != "yes" ]; then
            echo "::warning::OURA_SECRET_UPDATE_TOKEN is not set. PRs opened with GITHUB_TOKEN do not trigger pull_request workflows (GitHub restriction), so required checks never run and merges stall. Set OURA_SECRET_UPDATE_TOKEN to the same PAT you use for gh secret set (repo Contents + Pull requests)."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Oura data
        id: fetch_oura
        env:
          # Optional: Personal Access Token path (most reliable for personal projects)
          OURA_ACCESS_TOKEN: ${{ secrets.OURA_ACCESS_TOKEN }}
          OURA_CLIENT_ID: ${{ secrets.OURA_CLIENT_ID }}
          OURA_CLIENT_SECRET: ${{ secrets.OURA_CLIENT_SECRET }}
          OURA_REFRESH_TOKEN: ${{ secrets.OURA_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          node scripts/fetch_oura_and_write_json.mjs 2>&1 | tee .oura_fetch.log

      - name: Check if files changed
        id: check_changes
        if: steps.fetch_oura.outcome == 'success'
        run: |
          if [ -f .oura_no_change ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            rm -f .oura_no_change
          elif git diff --quiet oura_public.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create branch and PR if changed
        if: steps.check_changes.outputs.changed == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ env.GH_AUTH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="oura-update-$(date -u +%Y%m%d-%H%M%S)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          git checkout -b "$BRANCH_NAME"
          git add oura_public.json
          git commit -m "feat(health): update Oura Ring metrics [$(date -u +%Y-%m-%d)]"
          git push origin "$BRANCH_NAME"

          PR_URL=$(gh pr create \
            --title "feat(health): update Oura Ring metrics [$(date -u +%Y-%m-%d)]" \
            --body "Automated health data update from Oura Ring." \
            --base main \
            --head "$BRANCH_NAME")

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "Created PR: $PR_URL"

      - name: Merge Oura PR after CI (poll)
        id: merge_pr
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ env.GH_AUTH_TOKEN }}
        run: |
          PR_URL="${{ steps.create_pr.outputs.pr_url }}"
          echo "Waiting for required checks, then merging: $PR_URL"
          sleep 15

          for attempt in $(seq 1 48); do
            echo "merge attempt $attempt/48..."
            if gh pr merge "$PR_URL" --squash --delete-branch; then
              echo "merged=true" >> $GITHUB_OUTPUT
              echo "Merged successfully."
              exit 0
            fi
            STATE=$(gh pr view "$PR_URL" --json state -q .state 2>/dev/null || echo "")
            if [ "$STATE" = "MERGED" ]; then
              echo "merged=true" >> $GITHUB_OUTPUT
              echo "PR already merged."
              exit 0
            fi
            sleep 15
          done

          echo "::error::Timed out waiting to merge Oura PR. Open PRs require passing checks; verify OURA_SECRET_UPDATE_TOKEN is set so pull_request workflows run."
          echo "merged=false" >> $GITHUB_OUTPUT
          exit 1

      - name: Rotate OAuth secrets after refresh
        if: always() && steps.fetch_oura.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.OURA_SECRET_UPDATE_TOKEN }}
        run: |
          # Oura rotates refresh tokens when used. Failing to persist the new
          # refresh token permanently bricks the dashboard until manual reauth.
          # We also cache the access token so most runs skip refresh entirely.
          set -euo pipefail

          if [ ! -f .oura_rotated_token ] && [ ! -f .oura_rotated_access_token ]; then
            echo "No OAuth secret rotation required this run."
            exit 0
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::OAuth tokens rotated but OURA_SECRET_UPDATE_TOKEN is missing."
            echo "::error::Set OURA_SECRET_UPDATE_TOKEN so the workflow can update OURA_REFRESH_TOKEN / OURA_ACCESS_TOKEN."
            exit 1
          fi

          update_secret() {
            local name="$1"
            local file="$2"
            if [ ! -f "$file" ]; then
              return 0
            fi

            local value
            value="$(tr -d '\n' < "$file")"
            # GitHub Secrets API occasionally returns 503. Retry for ~15 minutes
            # because losing a rotated refresh token is irreversible.
            local attempt
            local sleep_s=5
            for attempt in $(seq 1 30); do
              if gh secret set "$name" --body "$value"; then
                rm -f "$file"
                echo "Updated ${name} secret automatically (attempt ${attempt})."
                return 0
              fi
              echo "Attempt ${attempt}/30 failed updating ${name}; retrying in ${sleep_s}s..."
              sleep "$sleep_s"
              if [ "$sleep_s" -lt 60 ]; then
                sleep_s=$((sleep_s * 2))
                if [ "$sleep_s" -gt 60 ]; then
                  sleep_s=60
                fi
              fi
            done

            echo "::error::Failed to update ${name} after 30 attempts."
            return 1
          }

          failed=0
          update_secret OURA_REFRESH_TOKEN .oura_rotated_token || failed=1
          update_secret OURA_ACCESS_TOKEN .oura_rotated_access_token || failed=1

          if [ "$failed" -ne 0 ]; then
            echo "::error::Secret rotation failed after OAuth refresh. Manual reauth is required before the next successful refresh can persist."
            exit 1
          fi

      - name: Open or update dashboard alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: Health dashboard automation alert
        run: |
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          LAST_ERROR=""
          if [ -f .oura_fetch.log ]; then
            LAST_ERROR="$(tail -n 20 .oura_fetch.log | sed 's/\r$//' | tail -n 1)"
          fi
          cat > .health_alert_body.md <<EOF
          @rudrakshbhandari the scheduled Oura health dashboard update failed.

          - Workflow: \`Oura Health Data Update\`
          - Run: ${RUN_URL}
          - Branch: \`${GITHUB_REF_NAME}\`
          - Triggered at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          - Last log line: \`${LAST_ERROR}\`

          Common causes:
          1. Refresh token rejected (\`HTTP 400: Invalid request\`) after a failed GitHub secret update following OAuth rotation
          2. Missing/expired \`OURA_SECRET_UPDATE_TOKEN\` so rotated tokens cannot be persisted
          3. Transient Oura API failure

          Recovery: run local browser reauth (\`set -a && source .env && set +a && node scripts/fetch_oura_and_write_json.mjs\`) then \`gh secret set OURA_REFRESH_TOKEN\` (and \`OURA_ACCESS_TOKEN\` if present) from the new local tokens.
          EOF

          ISSUE_NUMBER="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "'"${ISSUE_TITLE}"'") | .number' | head -n 1)"

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --body-file .health_alert_body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file .health_alert_body.md
          fi

      - name: Close dashboard alert issue after recovery
        if: success() && steps.fetch_oura.outcome == 'success' && (steps.check_changes.outputs.changed != 'true' || steps.merge_pr.outputs.merged == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: Health dashboard automation alert
        run: |
          ISSUE_NUMBER="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "'"${ISSUE_TITLE}"'") | .number' | head -n 1)"

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue close "$ISSUE_NUMBER" --comment "Automation recovered in https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi
