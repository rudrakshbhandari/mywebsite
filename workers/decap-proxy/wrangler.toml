# Cloudflare Worker config for Decap CMS GitHub OAuth proxy.
# See workers/README.md for setup instructions.

compatibility_date = "2025-01-01"
main = "src/index.ts"

name = "decap-proxy"

# Custom domain: decap.rudrakshbhandari.com
route = { pattern = "decap.rudrakshbhandari.com", zone_name = "rudrakshbhandari.com", custom_domain = true }
workers_dev = false

# Set to "1" if the content repo is private
# Comma-separated GitHub usernames allowed to log in (empty = allow all)
[vars]
GITHUB_REPO_PRIVATE = "0"
ALLOWED_GITHUB_USERS = "rudrakshbhandari"
