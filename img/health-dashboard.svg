<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="health-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="health-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#health-bg)"/>
  
  <!-- Chart bars representing health metrics -->
  <rect x="80" y="220" width="40" height="120" rx="4" fill="url(#health-accent)" opacity="0.9"/>
  <rect x="130" y="180" width="40" height="160" rx="4" fill="url(#health-accent)" opacity="0.8"/>
  <rect x="180" y="140" width="40" height="200" rx="4" fill="url(#health-accent)" opacity="0.95"/>
  <rect x="230" y="200" width="40" height="140" rx="4" fill="url(#health-accent)" opacity="0.7"/>
  <rect x="280" y="160" width="40" height="180" rx="4" fill="url(#health-accent)" opacity="0.85"/>
  <rect x="330" y="240" width="40" height="100" rx="4" fill="url(#health-accent)" opacity="0.6"/>
  <rect x="380" y="190" width="40" height="150" rx="4" fill="url(#health-accent)" opacity="0.75"/>
  <rect x="430" y="150" width="40" height="190" rx="4" fill="url(#health-accent)" opacity="0.9"/>
  <rect x="480" y="210" width="40" height="130" rx="4" fill="url(#health-accent)" opacity="0.65"/>
  
  <!-- Heart rate line -->
  <path d="M60 200 L100 180 L140 220 L180 160 L220 200 L260 140 L300 190 L340 150 L380 200 L420 170 L460 210 L500 180 L540 200" 
        stroke="#f87171" stroke-width="3" fill="none" opacity="0.8"/>
  
  <!-- Heart icon -->
  <circle cx="300" cy="100" r="40" fill="rgba(248, 113, 113, 0.15)"/>
  <path d="M300 125 C300 125 260 100 260 80 C260 65 270 55 285 55 C295 55 300 62 300 62 C300 62 305 55 315 55 C330 55 340 65 340 80 C340 100 300 125 300 125 Z" fill="#f87171"/>
  
  <text x="300" y="360" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="24" font-weight="500">Health Metrics Dashboard</text>
  <text x="300" y="385" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14">Oura Ring data visualization</text>
</svg>