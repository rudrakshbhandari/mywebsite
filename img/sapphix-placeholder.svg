<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sapphix-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="sapphix-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sapphix-bg)"/>
  <!-- Proximity / location circles (geo discovery theme) -->
  <circle cx="300" cy="200" r="60" fill="url(#sapphix-accent)" opacity="0.3"/>
  <circle cx="300" cy="200" r="40" fill="url(#sapphix-accent)" opacity="0.5"/>
  <circle cx="300" cy="200" r="20" fill="url(#sapphix-accent)" opacity="0.8"/>
  <!-- Outer nodes -->
  <circle cx="180" cy="120" r="25" fill="url(#sapphix-accent)" opacity="0.6"/>
  <circle cx="420" cy="120" r="25" fill="url(#sapphix-accent)" opacity="0.6"/>
  <circle cx="180" cy="280" r="25" fill="url(#sapphix-accent)" opacity="0.6"/>
  <circle cx="420" cy="280" r="25" fill="url(#sapphix-accent)" opacity="0.6"/>
  <text x="300" y="360" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="24" font-weight="500">Sapphix</text>
  <text x="300" y="385" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14">Women-only proximity dating app</text>
</svg>
